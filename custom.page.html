const row = document.getElementById('row');
const faces = [];

for (const [name, path] of Object.entries(CUSTOM)) {
  defineShape(name, { path });

  const cell = document.createElement('div');
  cell.className = 'cell';
  const box = document.createElement('div');
  box.className = 'face';
  const label = document.createElement('div');
  label.className = 'name';
  label.textContent = name;
  const p = document.createElement('div');
  p.className = 'path';
  p.textContent = path.slice(0, 40) + '…';

  cell.appendChild(box);
  cell.appendChild(label);
  cell.appendChild(p);
  row.appendChild(cell);

  faces.push(createFace(box, { shape: name, size: 180, color: '#E8E8E8', state: 'idle' }));
}

/* 状态按钮 */
const bar = document.getElementById('bar');
for (const s of STATE_ALL) {
  const b = document.createElement('button');
  b.textContent = s;
  b.dataset.state = s;
  b.onclick = () => apply(s);
  bar.appendChild(b);
}

function apply(s) {
  faces.forEach(f => f.state(s));
  document.querySelectorAll('#bar button').forEach(n => n.classList.toggle('on', n.dataset.state === s));
  document.getElementById('log').textContent = `${s} — ${STATE_HELP[s] || ''}`;
  current = s;
}

/* 自动轮播 */
let current = 'idle';
const LOOP = ['idle', 'thinking', 'working', 'searching', 'streaming', 'blocked', 'finished', 'failed', 'sleeping'];
let idx = 0;
const auto = setInterval(() => {
  idx = (idx + 1) % LOOP.length;
  apply(LOOP[idx]);
}, 2600);

/* 点任意处暂停轮播 */
document.addEventListener('click', () => clearInterval(auto), { once: true });

window.__faces = faces;
window.__apply = apply;
</script>
