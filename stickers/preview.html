<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 打工人 · 预览</title>
<style>
  :root { --bg:#0a0a0c; --fg:#ececef; --dim:#71717a; --line:#1c1c20; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif;
    padding:48px 32px 80px; max-width:1000px; margin:0 auto;
  }
  h1 { font-size:24px; font-weight:560; letter-spacing:-.02em; margin:0 0 6px; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 28px; }
  .bar { display:flex; gap:8px; margin-bottom:24px; }
  .bar button {
    font:inherit; font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#111116; color:var(--fg);
  }
  .bar button.on { background:var(--fg); color:#0a0a0c; border-color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .cell { border-radius:14px; overflow:hidden; background:#fff; }
  .cell img { display:block; width:100%; aspect-ratio:1; }
  footer { margin-top:40px; padding-top:20px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
  body.light { --bg:#f5f5f4; --fg:#111114; --dim:#6b6b72; --line:#e4e4e0; }
  body.light .cell { background:#fff; box-shadow:0 0 0 1px #e4e4e0; }
</style>
</head>
<body>
<h1>AI 打工人</h1>
<p class="sub">17 张 · 240×240 · peepface 导出</p>
<div class="bar">
  <button id="b-dark" class="on">深色聊天</button>
  <button id="b-light">浅色聊天</button>
  <button id="b-mono" class="on">黑白</button>
  <button id="b-color">橙色</button>
</div>
<div class="grid" id="grid"></div>
<footer>每个约 1.6 秒循环 · 共约 200 KB</footer>
<script>
  const files = ['idle','listening','thinking','searching','streaming','working',
    'waiting','blocked','finished','failed','sleeping','waking',
    'happy','confused','surprised','angry','working_moyu'];
  const grid = document.getElementById('grid');
  let colored = false;
  render();
  document.getElementById('b-dark').onclick = () => {
    document.body.classList.remove('light');
    b_dark.classList.add('on'); b_light.classList.remove('on');
  };
  document.getElementById('b-light').onclick = () => {
    document.body.classList.add('light');
    b_light.classList.add('on'); b_dark.classList.remove('on');
  };
  function render() {
    const dir = colored ? './color-gif/' : './gif/';
    grid.innerHTML = '';
    files.forEach(f => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.innerHTML = '<img src="' + dir + f + '.gif" alt="' + f + '" loading="lazy">';
      grid.appendChild(d);
    });
  }
  document.getElementById('b-mono').onclick = () => {
    colored = false; render();
    b_mono.classList.add('on'); b_color.classList.remove('on');
  };
  document.getElementById('b-color').onclick = () => {
    colored = true; render();
    b_color.classList.add('on'); b_mono.classList.remove('on');
  };
</script>
</body>
</html>
