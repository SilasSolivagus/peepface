<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#0B0B0D;overflow:hidden}
  #row{display:flex;align-items:center;justify-content:center;gap:14px;height:200px;width:920px}
  .c{width:118px;height:118px}
</style></head><body>
<div id="row"></div>
<script type="module">
import { createFace } from './index.js';
const states = ['idle','thinking','streaming','working','blocked','finished'];
const row = document.getElementById('row');
states.forEach(s => {
  const d = document.createElement('div'); d.className = 'c';
  row.appendChild(d);
  createFace(d, { shape: 'sphere', size: 118, color: '#EDEDED', spot: '#121212', state: s });
});
window.__ready = true;
</script></body></html>
