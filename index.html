<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peepface — agent 状态的视觉词汇表</title>
<meta name="description" content="12 个生命周期状态、12 KB、零依赖纯 SVG。让 agent 的状态一眼可读。">
<style>
  :root {
    --bg: #08080a;
    --panel: #0e0e11;
    --fg: #ececef;
    --dim: #71717a;
    --line: #1c1c20;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    padding: 72px 40px 100px;
    max-width: 1080px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  header { margin-bottom: 64px; }
  .eyebrow {
    font: 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 20px;
  }
  h1 {
    font-size: 40px; font-weight: 560; letter-spacing: -.035em;
    margin: 0 0 18px; line-height: 1.15;
  }
  .lede {
    font-size: 17px; color: #a1a1aa; max-width: 640px; margin: 0;
  }
  .lede b { color: var(--fg); font-weight: 500; }

  /* 主演示 */
  .stage {
    display: grid; grid-template-columns: 200px 1fr; gap: 48px;
    align-items: center;
    padding: 40px; margin-bottom: 20px;
    border: 1px solid var(--line); border-radius: 20px;
    background: var(--panel);
  }
  .stage-face { width: 160px; height: 160px; justify-self: center; }

  .timeline { display: flex; flex-direction: column; gap: 2px; }
  .row {
    display: grid; grid-template-columns: 92px 1fr; gap: 18px;
    align-items: center; padding: 7px 10px; border-radius: 8px;
    opacity: .32; transition: opacity .35s, background .35s;
  }
  .row.on { opacity: 1; background: #16161b; }
  .row .k {
    font: 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .02em;
    color: var(--dim); transition: color .35s;
  }
  .row.on .k { color: var(--accent); }
  .row .v { font-size: 13px; color: #a1a1aa; }
  .row.on .v { color: var(--fg); }

  .caption {
    font-size: 12px; color: var(--dim); margin: 0 0 56px 4px;
  }

  /* 十二格 */
  h2 {
    font-size: 13px; font-weight: 500; letter-spacing: .02em;
    color: var(--dim); margin: 0 0 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 6px;
  }
  .cell {
    padding: 22px 10px 16px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: #0b0b0e; border: 1px solid transparent;
    transition: border-color .2s;
  }
  .cell:hover { border-color: #26262c; }
  .cell-face { width: 68px; height: 68px; }
  .name {
    font: 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .03em;
    color: #b4b4bb;
  }
  .hint {
    font-size: 10.5px; line-height: 1.4; color: #5c5c66; text-align: center;
    max-width: 124px;
  }

  footer {
    margin-top: 72px; padding-top: 26px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
    display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
  }
  footer a { color: #a1a1aa; text-decoration: none; border-bottom: 1px solid #2a2a31; }
  footer a:hover { color: var(--fg); }
  code {
    font: 11px/1 ui-monospace, Menlo, monospace;
    background: #14141a; padding: 3px 7px; border-radius: 5px; color: #c4c4cc;
  }

  @media (max-width: 720px) {
    body { padding: 48px 20px 72px; }
    h1 { font-size: 30px; }
    .stage { grid-template-columns: 1fr; gap: 28px; padding: 28px; }
    .timeline { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">peepface · v0.1</div>
  <h1>agent 的状态，<br>应该一眼能读。</h1>
  <p class="lede">
    现在做 agent 的人，状态只有三种表达：转圈、三个点、一行小字。
    这三种<b>都分不清「在干活」和「卡死了」</b>——用户只能等，或者去点一下试试。
  </p>
</header>

<div class="stage">
  <div class="stage-face" id="hero"></div>
  <div class="timeline" id="timeline"></div>
</div>
<p class="caption">上面是同一张脸走完一轮任务。鼠标移到页面上，它会看你。</p>

<h2>十二个生命周期状态</h2>
<div class="grid" id="grid"></div>

<footer>
  <span><a href="https://github.com/SilasSolivagus/peepface">GitHub</a></span>
  <span><code>peepface.createFace(el, { state })</code></span>
  <span>12 KB · 零依赖 · 纯 SVG</span>
</footer>

<script src="./dist/peepface.js"></script>
<script>
  const SCRIPT = [
    ['idle',      '没事干，但醒着',               2200],
    ['thinking',  '收到请求，还没开口',           1800],
    ['working',   '在做事，用户不用管',           2600],
    ['streaming', '正在往外吐字',                 3000],
    ['finished',  '干完了',                       2000],
  ];

  /* ---- 主演示：一张脸走完整流程 ---- */
  const heroSlot = document.getElementById('hero');
  const timeline = document.getElementById('timeline');
  const hero = peepface.createFace(heroSlot, { state: 'idle', size: 160, dark: true });

  SCRIPT.forEach(([state, text]) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.state = state;
    row.innerHTML = '<span class="k">' + state + '</span><span class="v">' + text + '</span>';
    timeline.appendChild(row);
  });

  let i = 0;
  function step() {
    const [state, , dur] = SCRIPT[i % SCRIPT.length];
    hero.setState(state);
    timeline.querySelectorAll('.row').forEach(r => {
      r.classList.toggle('on', r.dataset.state === state);
    });
    i++;
    setTimeout(step, dur);
  }
  step();

  /* ---- 十二宫格：静态一览 ---- */
  const CELLS = [
    ['idle',      '没事干，但醒着'],
    ['listening', '你在打字，我在等'],
    ['thinking',  '收到请求，还没开口'],
    ['searching', '在翻找，眼在扫'],
    ['streaming', '正在往外吐字'],
    ['working',   '在做事，别管我'],
    ['waiting',   '等你决定'],
    ['blocked',   '过不去，要人拉一把'],
    ['finished',  '干完了，点个头'],
    ['failed',    '出错了'],
    ['sleeping',  '很久没人用'],
    ['waking',    '被叫醒了'],
  ];

  const grid = document.getElementById('grid');
  CELLS.forEach(([state, hint]) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const slot = document.createElement('div');
    slot.className = 'cell-face';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = state;
    const h = document.createElement('span');
    h.className = 'hint';
    h.textContent = hint;
    cell.append(slot, name, h);
    grid.appendChild(cell);
    peepface.createFace(slot, { state, size: 68, dark: true });
  });
</script>
</body>
</html>
